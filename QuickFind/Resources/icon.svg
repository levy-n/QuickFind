<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007ACC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Magnifying glass circle (outline) -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#glassGradient)" stroke-width="12"/>

  <!-- Glass circle interior (light/transparent) -->
  <circle cx="100" cy="100" r="64" fill="rgba(255, 255, 255, 0.1)"/>

  <!-- Handle -->
  <line x1="145" y1="145" x2="210" y2="210" stroke="url(#glassGradient)" stroke-width="12" stroke-linecap="round"/>
</svg>